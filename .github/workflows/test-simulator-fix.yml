name: Native iOS Baseline and Simulator Fix

on:
  push:
    branches: [test-app]
  workflow_dispatch:
    inputs:
      expected_app_source_sha256:
        description: 'Optional SHA-256 of the exact embedded App.swift UTF-8 bytes'
        required: false
        default: ''
        type: string

jobs:
  test-default-destination:
    if: github.ref != 'refs/heads/test-app'
    name: 'Test destinationPlatformOption default'
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v4

    - name: List available simulators
      run: |
        echo "=== Xcode version ==="
        xcodebuild -version
        echo ""
        echo "=== Available simulator runtimes ==="
        xcrun simctl list runtimes 2>&1 || echo "No runtimes"
        echo ""
        echo "=== Available devices ==="
        xcrun simctl list devices available 2>&1 | head -30
        echo ""
        echo "=== Available destinations for scheme ==="
        cd source/ios/AdaptiveCards
        pod install --repo-update 2>&1 | tail -5
        xcodebuild -workspace AdaptiveCards.xcworkspace -scheme AdaptiveCards -showdestinations 2>&1 | head -40

    - name: Test build with generic simulator destination
      working-directory: source/ios/AdaptiveCards
      run: |
        echo "=== Testing: generic/platform=iOS Simulator ==="
        xcodebuild build \
          -workspace AdaptiveCards.xcworkspace \
          -scheme AdaptiveCards \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
          2>&1 | tail -20
        echo "EXIT_CODE=$?"

    - name: Test build with default (no destination specified)
      working-directory: source/ios/AdaptiveCards
      run: |
        echo "=== Testing: no -destination flag, just -sdk iphonesimulator ==="
        xcodebuild build \
          -workspace AdaptiveCards.xcworkspace \
          -scheme AdaptiveCards \
          -sdk iphonesimulator \
          CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
          2>&1 | tail -20
        echo "EXIT_CODE=$?"

  native-uikit-baseline:
    name: Primitive UIKit / two cold iPhones
    if: github.ref == 'refs/heads/test-app' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: native-uikit-baseline-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      BASELINE_ROOT: ${{ github.workspace }}/.native-ios-baseline
      EXPECTED_APP_SOURCE_SHA256: ${{ inputs.expected_app_source_sha256 || '' }}
    steps:
      - name: Check out only this workflow at the triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: /.github/workflows/test-simulator-fix.yml
          sparse-checkout-cone-mode: false

      - name: Generate embedded app, UI tests, project and source manifest
        id: generate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import re
          import xml.etree.ElementTree as ET

          APP_SOURCE = r'''import UIKit

          @main
          final class AppDelegate: UIResponder, UIApplicationDelegate {
            var window: UIWindow?

            func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
              let window = UIWindow(frame: UIScreen.main.bounds)
              window.overrideUserInterfaceStyle = .light
              window.rootViewController = BaselineViewController()
              window.makeKeyAndVisible()
              self.window = window
              return true
            }
          }

          final class BaselineViewController: UIViewController, UITextFieldDelegate {
            private let titleLabel = UILabel()
            private let countLabel = UILabel()
            private let incrementButton = UIButton(type: .system)
            private let resetButton = UIButton(type: .system)
            private let input = UITextField()
            private let submitButton = UIButton(type: .system)
            private let submittedLabel = UILabel()
            private var count = 0

            override func viewDidLoad() {
              super.viewDidLoad()
              view.backgroundColor = .systemBackground
              titleLabel.text = "Native UIKit Baseline"
              titleLabel.font = .preferredFont(forTextStyle: .title2)
              titleLabel.accessibilityIdentifier = "baseline.title"
              countLabel.text = "Count: 0"
              countLabel.font = .preferredFont(forTextStyle: .largeTitle)
              countLabel.accessibilityIdentifier = "baseline.count"
              configure(incrementButton, title: "Increment", symbol: "plus", identifier: "baseline.increment")
              configure(resetButton, title: "Reset", symbol: "arrow.counterclockwise", identifier: "baseline.reset")
              configure(submitButton, title: "Submit", symbol: "paperplane", identifier: "baseline.submit")
              incrementButton.addTarget(self, action: #selector(increment), for: .touchUpInside)
              resetButton.addTarget(self, action: #selector(reset), for: .touchUpInside)
              submitButton.addTarget(self, action: #selector(submit), for: .touchUpInside)
              input.accessibilityIdentifier = "baseline.input"
              input.accessibilityLabel = "Message"
              input.placeholder = "Message"
              input.borderStyle = .roundedRect
              input.font = .preferredFont(forTextStyle: .body)
              input.autocorrectionType = .no
              input.autocapitalizationType = .none
              input.spellCheckingType = .no
              input.returnKeyType = .done
              input.delegate = self
              submittedLabel.text = "Submitted: (none)"
              submittedLabel.font = .preferredFont(forTextStyle: .body)
              submittedLabel.numberOfLines = 0
              submittedLabel.accessibilityIdentifier = "baseline.submitted"
              let actions = UIStackView(arrangedSubviews: [incrementButton, resetButton])
              actions.spacing = 12
              actions.distribution = .fillEqually
              let stack = UIStackView(arrangedSubviews: [titleLabel, countLabel, actions, input, submitButton, submittedLabel])
              stack.axis = .vertical
              stack.spacing = 16
              stack.translatesAutoresizingMaskIntoConstraints = false
              view.addSubview(stack)
              NSLayoutConstraint.activate([
                stack.topAnchor.constraint(equalTo: view.safeAreaLayoutGuide.topAnchor, constant: 24),
                stack.leadingAnchor.constraint(equalTo: view.safeAreaLayoutGuide.leadingAnchor, constant: 24),
                stack.trailingAnchor.constraint(equalTo: view.safeAreaLayoutGuide.trailingAnchor, constant: -24),
                stack.bottomAnchor.constraint(lessThanOrEqualTo: view.keyboardLayoutGuide.topAnchor, constant: -16),
                actions.heightAnchor.constraint(equalToConstant: 48),
                input.heightAnchor.constraint(equalToConstant: 48),
                submitButton.heightAnchor.constraint(equalToConstant: 48)
              ])
            }

            override func viewDidLayoutSubviews() {
              super.viewDidLayoutSubviews()
              writeLayoutMetadata()
            }

            private func configure(_ button: UIButton, title: String, symbol: String, identifier: String) {
              var configuration = UIButton.Configuration.tinted()
              configuration.title = title
              configuration.image = UIImage(systemName: symbol)
              configuration.imagePadding = 8
              configuration.baseForegroundColor = .systemBlue
              button.configuration = configuration
              button.accessibilityIdentifier = identifier
            }

            @objc private func increment() {
              count += 1
              countLabel.text = "Count: \(count)"
              view.layoutIfNeeded()
              writeLayoutMetadata()
            }

            @objc private func reset() {
              count = 0
              countLabel.text = "Count: 0"
              view.layoutIfNeeded()
              writeLayoutMetadata()
            }

            @objc private func submit() {
              view.endEditing(true)
              submittedLabel.text = "Submitted: \(input.text ?? "")"
              view.layoutIfNeeded()
              writeLayoutMetadata()
            }

            func textFieldShouldReturn(_ textField: UITextField) -> Bool {
              textField.resignFirstResponder()
              return true
            }

            private func writeLayoutMetadata() {
              guard let window = view.window else { return }
              func rect(_ frame: CGRect) -> [String: Double] {
                ["x": Double(frame.minX), "y": Double(frame.minY), "width": Double(frame.width), "height": Double(frame.height)]
              }
              let screen = window.screen
              let controls: [UIView] = [titleLabel, countLabel, incrementButton, resetButton, input, submitButton, submittedLabel]
              let model: [String: Any] = [
                "kind": "native-app-layout", "schemaVersion": 1,
                "count": count, "submittedLabel": submittedLabel.text ?? "",
                "systemVersion": UIDevice.current.systemVersion,
                "operatingSystemVersion": ProcessInfo.processInfo.operatingSystemVersionString,
                "interfaceStyle": traitCollection.userInterfaceStyle == .light ? "light" : "other",
                "screenBounds": rect(screen.bounds), "nativeScreenBounds": rect(screen.nativeBounds),
                "scale": Double(screen.scale), "nativeScale": Double(screen.nativeScale),
                "safeAreaBounds": rect(view.convert(view.bounds.inset(by: view.safeAreaInsets), to: window)),
                "safeAreaInsets": ["top": Double(view.safeAreaInsets.top), "left": Double(view.safeAreaInsets.left), "bottom": Double(view.safeAreaInsets.bottom), "right": Double(view.safeAreaInsets.right)],
                "controls": controls.map { control -> [String: Any] in
                  ["identifier": control.accessibilityIdentifier ?? "", "frame": rect(control.convert(control.bounds, to: window)), "enabled": (control as? UIControl)?.isEnabled ?? true, "hidden": control.isHidden, "alpha": Double(control.alpha)]
                }
              ]
              do {
                let directory = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                let data = try JSONSerialization.data(withJSONObject: model, options: [.prettyPrinted, .sortedKeys])
                try data.write(to: directory.appendingPathComponent("native-layout.json"), options: .atomic)
              } catch {
                NSLog("Native baseline metadata failed: %@", String(describing: error))
              }
            }
          }
          '''

          root = Path(os.environ["BASELINE_ROOT"])
          source = root / "source"
          (root / "evidence" / "logs").mkdir(parents=True, exist_ok=True)
          expected = os.environ.get("EXPECTED_APP_SOURCE_SHA256", "")
          if expected and not re.fullmatch(r"[0-9a-fA-F]{64}", expected):
            raise SystemExit("expected_app_source_sha256 must be exactly 64 hexadecimal characters")
          app_bytes = APP_SOURCE.encode("utf-8")
          app_hash = hashlib.sha256(app_bytes).hexdigest()
          if expected and app_hash != expected.lower():
            raise SystemExit("Embedded App.swift SHA-256 does not match expected_app_source_sha256")

          objects = {}
          def identifier(key):
            return hashlib.sha256(key.encode("utf-8")).hexdigest()[:24].upper()
          def add(key, kind, **properties):
            objects[identifier(key)] = dict(isa=kind, **properties)
            return identifier(key)
          def configurations(key, extra):
            references = []
            for name in ("Debug", "Release"):
              settings = dict(extra, SWIFT_OPTIMIZATION_LEVEL="-Onone" if name == "Debug" else "-O")
              references.append(add(key + name, "XCBuildConfiguration", name=name, buildSettings=settings))
            return add(key + "Configurations", "XCConfigurationList", buildConfigurations=references, defaultConfigurationIsVisible="0", defaultConfigurationName="Release")
          common = dict(IPHONEOS_DEPLOYMENT_TARGET="15.0", SWIFT_VERSION="5.0", SDKROOT="iphoneos", CLANG_ENABLE_MODULES="YES", CODE_SIGNING_ALLOWED="NO", CODE_SIGNING_REQUIRED="NO", CODE_SIGN_IDENTITY="", TARGETED_DEVICE_FAMILY="1", ENABLE_USER_SCRIPT_SANDBOXING="YES")
          project_config = configurations("Project", common)
          app_config = configurations("App", dict(PRODUCT_NAME="$(TARGET_NAME)", PRODUCT_BUNDLE_IDENTIFIER="org.hggz.NativeUIKitBaseline", INFOPLIST_FILE="NativeBaseline/Info.plist", GENERATE_INFOPLIST_FILE="NO", SUPPORTED_PLATFORMS="iphoneos iphonesimulator", LD_RUNPATH_SEARCH_PATHS=["$(inherited)", "@executable_path/Frameworks"]))
          test_config = configurations("Tests", dict(PRODUCT_NAME="$(TARGET_NAME)", PRODUCT_BUNDLE_IDENTIFIER="org.hggz.NativeUIKitBaselineUITests", INFOPLIST_FILE="NativeBaselineUITests/Info.plist", GENERATE_INFOPLIST_FILE="NO", SUPPORTED_PLATFORMS="iphonesimulator", TEST_TARGET_NAME="NativeBaseline", ENABLE_TESTING_SEARCH_PATHS="YES", LD_RUNPATH_SEARCH_PATHS=["$(inherited)", "@executable_path/Frameworks", "@loader_path/Frameworks"]))
          app_ref = add("AppSource", "PBXFileReference", lastKnownFileType="sourcecode.swift", path="App.swift", sourceTree="<group>")
          test_ref = add("TestSource", "PBXFileReference", lastKnownFileType="sourcecode.swift", path="UITest.swift", sourceTree="<group>")
          app_info = add("AppInfo", "PBXFileReference", lastKnownFileType="text.plist.xml", path="Info.plist", sourceTree="<group>")
          test_info = add("TestInfo", "PBXFileReference", lastKnownFileType="text.plist.xml", path="Info.plist", sourceTree="<group>")
          app_product = add("AppProduct", "PBXFileReference", explicitFileType="wrapper.application", includeInIndex="0", path="NativeBaseline.app", sourceTree="BUILT_PRODUCTS_DIR")
          test_product = add("TestProduct", "PBXFileReference", explicitFileType="wrapper.cfbundle", includeInIndex="0", path="NativeBaselineUITests.xctest", sourceTree="BUILT_PRODUCTS_DIR")
          app_group = add("AppGroup", "PBXGroup", path="NativeBaseline", sourceTree="<group>", children=[app_ref, app_info])
          test_group = add("TestGroup", "PBXGroup", path="NativeBaselineUITests", sourceTree="<group>", children=[test_ref, test_info])
          products = add("Products", "PBXGroup", name="Products", sourceTree="<group>", children=[app_product, test_product])
          main_group = add("MainGroup", "PBXGroup", sourceTree="<group>", children=[app_group, test_group, products])
          proxy = add("TestProxy", "PBXContainerItemProxy", containerPortal=identifier("Project"), proxyType="1", remoteGlobalIDString=identifier("AppTarget"), remoteInfo="NativeBaseline")
          dependency = add("TestDependency", "PBXTargetDependency", target=identifier("AppTarget"), targetProxy=proxy)
          for key, name, source_ref, product, config, product_type, dependencies in [
            ("App", "NativeBaseline", app_ref, app_product, app_config, "com.apple.product-type.application", []),
            ("Tests", "NativeBaselineUITests", test_ref, test_product, test_config, "com.apple.product-type.bundle.ui-testing", [dependency]),
          ]:
            build_file = add(key + "BuildFile", "PBXBuildFile", fileRef=source_ref)
            phases = [add(key + "Sources", "PBXSourcesBuildPhase", buildActionMask="2147483647", files=[build_file], runOnlyForDeploymentPostprocessing="0")]
            for phase in ("Frameworks", "Resources"):
              phases.append(add(key + phase, "PBX" + phase + "BuildPhase", buildActionMask="2147483647", files=[], runOnlyForDeploymentPostprocessing="0"))
            add(key + "Target", "PBXNativeTarget", name=name, productName=name, productReference=product, productType=product_type, buildConfigurationList=config, buildPhases=phases, buildRules=[], dependencies=dependencies)
          add("Project", "PBXProject", attributes={"LastUpgradeCheck": "1600", "TargetAttributes": {identifier("AppTarget"): {"CreatedOnToolsVersion": "16.0"}, identifier("TestsTarget"): {"CreatedOnToolsVersion": "16.0", "TestTargetID": identifier("AppTarget")}}}, buildConfigurationList=project_config, compatibilityVersion="Xcode 14.0", developmentRegion="en", knownRegions=["en", "Base"], mainGroup=main_group, productRefGroup=products, projectDirPath="", projectRoot="", targets=[identifier("AppTarget"), identifier("TestsTarget")])
          def pbx(value, depth=0):
            indentation = "\t" * depth
            if isinstance(value, dict):
              return "{\n" + "".join("\t" * (depth + 1) + key + " = " + pbx(item, depth + 1) + ";\n" for key, item in sorted(value.items())) + indentation + "}"
            if isinstance(value, list):
              return "(\n" + "".join("\t" * (depth + 1) + pbx(item, depth + 1) + ",\n" for item in value) + indentation + ")"
            if isinstance(value, str) and re.fullmatch(r"[A-Za-z0-9_./]+", value):
              return value
            return json.dumps(value)
          project_lines = ["// !$*UTF8*$!", "{", "\tarchiveVersion = 1;", "\tclasses = {};", "\tobjectVersion = 56;", "\tobjects = {"]
          for kind in sorted({item["isa"] for item in objects.values()}):
            project_lines.append("\n/* Begin " + kind + " section */")
            for object_id, item in sorted(objects.items()):
              if item["isa"] == kind:
                project_lines.append("\t\t" + object_id + " = " + pbx(item, 2) + ";")
            project_lines.append("/* End " + kind + " section */\n")
          project_lines.extend(["\t};", "\trootObject = " + identifier("Project") + ";", "}", ""])
          project = "\n".join(project_lines)

          scheme = ET.Element("Scheme", LastUpgradeVersion="1600", version="1.7")
          def buildable(parent, key, name, product):
            ET.SubElement(parent, "BuildableReference", BuildableIdentifier="primary", BlueprintIdentifier=identifier(key), BuildableName=product, BlueprintName=name, ReferencedContainer="container:NativeBaseline.xcodeproj")
          build_action = ET.SubElement(scheme, "BuildAction", parallelizeBuildables="NO", buildImplicitDependencies="YES")
          entries = ET.SubElement(build_action, "BuildActionEntries")
          for key, name, product, other in [("AppTarget", "NativeBaseline", "NativeBaseline.app", "YES"), ("TestsTarget", "NativeBaselineUITests", "NativeBaselineUITests.xctest", "NO")]:
            entry = ET.SubElement(entries, "BuildActionEntry", buildForTesting="YES", buildForRunning=other, buildForProfiling=other, buildForArchiving=other, buildForAnalyzing=other)
            buildable(entry, key, name, product)
          test_action = ET.SubElement(scheme, "TestAction", buildConfiguration="Debug", selectedDebuggerIdentifier="Xcode.DebuggerFoundation.Debugger.LLDB", selectedLauncherIdentifier="Xcode.IDEFoundation.Launcher.LLDB", shouldUseLaunchSchemeArgsEnv="YES")
          testable = ET.SubElement(ET.SubElement(test_action, "Testables"), "TestableReference", skipped="NO", parallelizable="NO")
          buildable(testable, "TestsTarget", "NativeBaselineUITests", "NativeBaselineUITests.xctest")
          for tag, configuration in [("LaunchAction", "Debug"), ("ProfileAction", "Release")]:
            action = ET.SubElement(scheme, tag, buildConfiguration=configuration, useCustomWorkingDirectory="NO")
            runnable = ET.SubElement(action, "BuildableProductRunnable", runnableDebuggingMode="0")
            buildable(runnable, "AppTarget", "NativeBaseline", "NativeBaseline.app")
          ET.SubElement(scheme, "AnalyzeAction", buildConfiguration="Debug")
          ET.SubElement(scheme, "ArchiveAction", buildConfiguration="Release", revealArchiveInOrganizer="NO")
          ET.indent(scheme, space="  ")
          info = dict(CFBundleDevelopmentRegion="$(DEVELOPMENT_LANGUAGE)", CFBundleExecutable="$(EXECUTABLE_NAME)", CFBundleIdentifier="$(PRODUCT_BUNDLE_IDENTIFIER)", CFBundleInfoDictionaryVersion="6.0", CFBundleName="$(PRODUCT_NAME)", CFBundleShortVersionString="1.0", CFBundleVersion="1")
          app_plist = dict(info, CFBundlePackageType="APPL", CFBundleDisplayName="Native UIKit Baseline", LSRequiresIPhoneOS=True, UIDeviceFamily=[1], UILaunchScreen={}, UIUserInterfaceStyle="Light", UISupportedInterfaceOrientations=["UIInterfaceOrientationPortrait"])
          files = {
            "NativeBaseline/App.swift": app_bytes,
            "NativeBaseline/Info.plist": plistlib.dumps(app_plist, sort_keys=True),
            "NativeBaselineUITests/Info.plist": plistlib.dumps(dict(info, CFBundlePackageType="BNDL"), sort_keys=True),
            "NativeBaseline.xcodeproj/project.pbxproj": project.encode("utf-8"),
            "NativeBaseline.xcodeproj/xcshareddata/xcschemes/NativeBaseline.xcscheme": ET.tostring(scheme, encoding="utf-8", xml_declaration=True) + b"\n",
          }
          for name, data in sorted(files.items()):
            destination = source / name
            destination.parent.mkdir(parents=True, exist_ok=True)
            destination.write_bytes(data)
          print("Generated native project")
          PY

      - name: Embed synchronized UI tests and pin native sources
        id: source-pin
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["BASELINE_ROOT"])
          source = root / "source"
          UI_TEST_SOURCE = r'''import XCTest

          final class NativeBaselineUITests: XCTestCase {
            override func setUpWithError() throws {
              continueAfterFailure = false
              XCUIDevice.shared.orientation = .portrait
            }

            func testColdLaunchActionsAndLayout() throws {
              let app = XCUIApplication()
              app.terminate()
              app.launch()
              XCTAssertTrue(app.wait(for: .runningForeground, timeout: 15))
              let counter = app.staticTexts["baseline.count"]
              XCTAssertTrue(counter.waitForExistence(timeout: 15))
              expect(counter, label: "Count: 0")
              expect(app.staticTexts["baseline.submitted"], label: "Submitted: (none)")
              XCTAssertEqual(app.textFields["baseline.input"].value as? String, "Message")
              try capture(app, state: "initial")

              app.buttons["baseline.increment"].tap()
              expect(counter, label: "Count: 1")
              try capture(app, state: "increment-1")
              app.buttons["baseline.increment"].tap()
              expect(counter, label: "Count: 2")
              try capture(app, state: "increment-2")
              app.buttons["baseline.reset"].tap()
              expect(counter, label: "Count: 0")
              try capture(app, state: "reset")

              let input = app.textFields["baseline.input"]
              input.tap()
              input.typeText("Hello native iOS\n")
              let keyboardGone = XCTNSPredicateExpectation(predicate: NSPredicate(format: "exists == false"), object: app.keyboards.firstMatch)
              wait(for: [keyboardGone], timeout: 10)
              XCTAssertEqual(input.value as? String, "Hello native iOS")
              app.buttons["baseline.submit"].tap()
              expect(app.staticTexts["baseline.submitted"], label: "Submitted: Hello native iOS")
              expect(counter, label: "Count: 0")
              try capture(app, state: "submitted")
            }

            private func expect(_ element: XCUIElement, label: String) {
              let expectation = XCTNSPredicateExpectation(predicate: NSPredicate(format: "label == %@", label), object: element)
              wait(for: [expectation], timeout: 10)
              XCTAssertEqual(element.label, label)
            }

            private func capture(_ app: XCUIApplication, state: String) throws {
              let identifiers = ["baseline.title", "baseline.count", "baseline.increment", "baseline.reset", "baseline.input", "baseline.submit", "baseline.submitted"]
              let window = app.windows.firstMatch
              XCTAssertTrue(window.exists)
              XCTAssertGreaterThan(window.frame.width, 0)
              XCTAssertGreaterThan(window.frame.height, window.frame.width)
              func rect(_ frame: CGRect) -> [String: Double] {
                ["x": Double(frame.minX), "y": Double(frame.minY), "width": Double(frame.width), "height": Double(frame.height)]
              }
              var controls: [[String: Any]] = []
              var frames: [CGRect] = []
              for identifier in identifiers {
                let element = app.descendants(matching: .any).matching(identifier: identifier).firstMatch
                XCTAssertTrue(element.exists, identifier)
                XCTAssertTrue(element.isHittable, identifier)
                XCTAssertTrue(element.isEnabled, identifier)
                XCTAssertFalse(element.frame.isEmpty, identifier)
                XCTAssertTrue(window.frame.contains(element.frame), identifier)
                for previous in frames {
                  XCTAssertTrue(previous.intersection(element.frame).isEmpty, identifier)
                }
                if element.elementType == .button || element.elementType == .textField {
                  XCTAssertGreaterThanOrEqual(element.frame.height, 44, identifier)
                }
                frames.append(element.frame)
                controls.append(["identifier": identifier, "label": element.label, "value": element.value as? String ?? "", "frame": rect(element.frame), "enabled": element.isEnabled, "hittable": element.isHittable])
              }
              let description = app.debugDescription
              var model: [String: Any] = ["kind": "native-ui-observation", "schemaVersion": 1, "state": state, "windowBounds": rect(window.frame), "controls": controls, "accessibilityDebugDescription": description]
              let directory = URL(fileURLWithPath: try XCTUnwrap(ProcessInfo.processInfo.environment["NATIVE_CAPTURE_ROOT"]), isDirectory: true)
              let captureID = UUID().uuidString
              let requestURL = directory.appendingPathComponent("\(state).request.json")
              let acknowledgmentURL = directory.appendingPathComponent("\(state).ack.json")
              XCTAssertFalse(FileManager.default.fileExists(atPath: requestURL.path))
              XCTAssertFalse(FileManager.default.fileExists(atPath: acknowledgmentURL.path))
              let request: [String: Any] = ["schemaVersion": 1, "state": state, "captureID": captureID, "observation": model, "requestedAt": Date().timeIntervalSince1970]
              try JSONSerialization.data(withJSONObject: request, options: [.prettyPrinted, .sortedKeys]).write(to: requestURL, options: .atomic)
              let captured = XCTNSPredicateExpectation(predicate: NSPredicate { _, _ in
                FileManager.default.fileExists(atPath: acknowledgmentURL.path)
              }, object: nil)
              wait(for: [captured], timeout: 45)
              let acknowledgment = try XCTUnwrap(JSONSerialization.jsonObject(with: Data(contentsOf: acknowledgmentURL)) as? [String: Any])
              XCTAssertEqual(acknowledgment["captureID"] as? String, captureID)
              XCTAssertEqual(acknowledgment["state"] as? String, state)
              XCTAssertEqual(acknowledgment["status"] as? String, "captured")
              model["framebufferCapture"] = acknowledgment
              let data = try JSONSerialization.data(withJSONObject: model, options: [.prettyPrinted, .sortedKeys])
              let layout = XCTAttachment(data: data, uniformTypeIdentifier: "public.json")
              layout.name = "baseline-\(state)-layout.json"
              layout.lifetime = .keepAlways
              add(layout)
              let accessibility = XCTAttachment(string: description)
              accessibility.name = "baseline-\(state)-accessibility.txt"
              accessibility.lifetime = .keepAlways
              add(accessibility)
              let screenshot = XCTAttachment(data: XCUIScreen.main.screenshot().pngRepresentation, uniformTypeIdentifier: "public.png")
              screenshot.name = "baseline-\(state).png"
              screenshot.lifetime = .keepAlways
              add(screenshot)
            }
          }
          '''
          (source / "NativeBaselineUITests/UITest.swift").write_bytes(UI_TEST_SOURCE.encode("utf-8"))
          expected = os.environ.get("EXPECTED_APP_SOURCE_SHA256", "")
          app_hash = hashlib.sha256((source / "NativeBaseline/App.swift").read_bytes()).hexdigest()
          if expected and app_hash != expected.lower():
            raise SystemExit("Generated App.swift does not match expected_app_source_sha256")
          records = []
          for path in sorted(source.rglob("*")):
            if path.is_file():
              data = path.read_bytes()
              records.append(dict(path=path.relative_to(source).as_posix(), bytes=len(data), sha256=hashlib.sha256(data).hexdigest()))
          if len(records) != 6:
            raise SystemExit("Expected exactly six native project files")
          workflow = Path(os.environ["GITHUB_WORKSPACE"]) / ".github/workflows/test-simulator-fix.yml"
          manifest = dict(schemaVersion=1, baselineScope="primitive UIKit", originalAppQualified=False, localRenderingMatched=False, appSourcePath="NativeBaseline/App.swift", appSourceSHA256=app_hash, sourceEncoding="UTF-8", sourceLineEndings="LF", expectedAppSourceSHA256=expected.lower() or None, expectedAppSourceVerified=True if expected else None, files=records, workflowSHA256=hashlib.sha256(workflow.read_bytes()).hexdigest(), commit=os.environ["GITHUB_SHA"], ref=os.environ["GITHUB_REF"], repository=os.environ["GITHUB_REPOSITORY"])
          (root / "source-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (root / "evidence" / "workflow.yml").write_bytes(workflow.read_bytes())
          print(json.dumps(dict(generatedFiles=len(records), appSourceSHA256=app_hash, baselineScope=manifest["baselineScope"]), indent=2))
          PY

      - name: Record default Xcode and select an available iPhone runtime
        id: environment
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess

          evidence = Path(os.environ["BASELINE_ROOT"]) / "evidence"
          def capture(name, command, timeout=90):
            stdout = evidence / "logs" / (name + ".stdout")
            stderr = evidence / "logs" / (name + ".stderr")
            with stdout.open("wb") as output, stderr.open("wb") as errors:
              result = subprocess.run(command, stdout=output, stderr=errors, timeout=timeout)
            result.check_returncode()
            return stdout.read_text(encoding="utf-8").strip()
          runtimes = json.loads(capture("runtimes", ["xcrun", "simctl", "list", "runtimes", "--json"], timeout=180))["runtimes"]
          device_types = json.loads(capture("device-types", ["xcrun", "simctl", "list", "devicetypes", "--json"]))["devicetypes"]
          def version(runtime):
            parts = tuple(int(part) for part in runtime["version"].split("."))
            return (parts + (0, 0, 0))[:3]
          available = [runtime for runtime in runtimes if runtime.get("isAvailable") is True and runtime["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS-") and version(runtime) >= (15, 0, 0)]
          available.sort(key=lambda runtime: (version(runtime)[0] == 18, version(runtime)), reverse=True)
          selected = None
          for runtime in available:
            runtime_version = version(runtime)
            encoded_version = (runtime_version[0] << 16) | (runtime_version[1] << 8) | runtime_version[2]
            for name in ("iPhone 16", "iPhone 15"):
              matches = [device for device in device_types if device["name"] == name and device.get("productFamily", "iPhone") == "iPhone" and ".iPhone-" in device["identifier"] and int(device.get("minRuntimeVersion", 0)) <= encoded_version <= int(device.get("maxRuntimeVersion", 0xFFFFFFFF))]
              if matches:
                selected = dict(runtime=runtime, deviceType=matches[0], deploymentTarget="15.0", runtimeIsDeploymentTarget=runtime_version == (15, 0, 0))
                break
            if selected:
              break
          if not selected:
            raise SystemExit("No installed, compatible iPhone 16 or iPhone 15 iOS runtime; no runtime downloads are permitted")
          sdks = {}
          for sdk in ("iphoneos", "iphonesimulator"):
            sdks[sdk] = {field: capture(sdk + "-" + field, ["xcrun", "--sdk", sdk, option]) for field, option in [("path", "--show-sdk-path"), ("version", "--show-sdk-version"), ("build", "--show-sdk-build-version")]}
          environment = dict(xcode=capture("xcode", ["xcodebuild", "-version"]), swiftCompiler=capture("swift", ["xcrun", "swift", "--version"]), developerDirectory=capture("developer-directory", ["xcode-select", "-p"]), hostVersion=capture("host-version", ["sw_vers"]), runnerArchitecture=platform.machine(), runnerOS=os.environ.get("RUNNER_OS"), runnerImage=os.environ.get("ImageOS"), runnerImageVersion=os.environ.get("ImageVersion"), sdks=sdks, selection=selected)
          if environment["runnerArchitecture"] not in ("arm64", "x86_64"):
            raise SystemExit("Unsupported native runner architecture")
          (evidence / "environment.json").write_text(json.dumps(environment, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(environment, indent=2))
          PY

