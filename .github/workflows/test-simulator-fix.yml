      - name: Build and run XCUITest on two fresh cold iPhones
        id: cold
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import select
          import shutil
          import signal
          import struct
          import subprocess
          import sys
          import time
          import uuid

          root = Path(os.environ["BASELINE_ROOT"])
          evidence = root / "evidence"
          environment = json.loads((evidence / "environment.json").read_text())
          selection = environment["selection"]
          derived = root / "derived-simulator"
          app = derived / "Build/Products/Debug-iphonesimulator/NativeBaseline.app"
          bundle_id = "org.hggz.NativeUIKitBaseline"
          owned = []
          failure_code = 0
          built = False
          original_test_plan = None
          states = ("initial", "increment-1", "increment-2", "reset", "submitted")
          def stop_requested(signum, frame):
            raise SystemExit(128 + signum)
          signal.signal(signal.SIGINT, stop_requested)
          signal.signal(signal.SIGTERM, stop_requested)
          def save(path, value):
            path.write_text(json.dumps(value, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          def invoke(command, log, timeout=90, check=True):
            print("+ " + " ".join(str(part) for part in command), flush=True)
            with log.open("w", encoding="utf-8") as output:
              result = subprocess.run(command, stdout=output, stderr=subprocess.STDOUT, text=True, timeout=timeout)
            if check and result.returncode:
              print(log.read_text(encoding="utf-8", errors="replace")[-16000:], flush=True)
              result.check_returncode()
            return result
          def configure_test_plan(original, destination, capture_root):
            plan = plistlib.loads(original.read_bytes())
            if "TestConfigurations" in plan:
              targets = [target for configuration in plan["TestConfigurations"] for target in configuration.get("TestTargets", [])]
            else:
              targets = [value for key, value in plan.items() if key != "__xctestrun_metadata__" and isinstance(value, dict)]
            if len(targets) != 1 or targets[0].get("IsUITestBundle") is not True or "NativeBaselineUITests" not in targets[0].get("TestBundlePath", ""):
              raise ValueError("Expected exactly the native UI-test target in the generated xctestrun")
            target = targets[0]
            variables = target.setdefault("EnvironmentVariables", {})
            if "NATIVE_CAPTURE_ROOT" in variables:
              raise ValueError("Capture directory was already configured")
            variables["NATIVE_CAPTURE_ROOT"] = str(capture_root)
            destination.write_bytes(plistlib.dumps(plan, sort_keys=True))
          def validate_capture_request(request, state, capture_ids):
            capture_id = request.get("captureID")
            if request.get("schemaVersion") != 1 or request.get("state") != state or state not in states:
              raise ValueError("Unexpected native capture state")
            if not isinstance(capture_id, str) or str(uuid.UUID(capture_id)).upper() != capture_id or capture_id in capture_ids:
              raise ValueError("Invalid or reused capture identity")
            observation = request.get("observation", {})
            if observation.get("kind") != "native-ui-observation" or observation.get("state") != state:
              raise ValueError("Request does not contain the tested native observation")
            controls = {control["identifier"]: control for control in observation.get("controls", [])}
            count = 1 if state == "increment-1" else 2 if state == "increment-2" else 0
            if controls.get("baseline.count", {}).get("label") != "Count: " + str(count):
              raise ValueError("Native state count does not match capture request")
            submitted = "Submitted: Hello native iOS" if state == "submitted" else "Submitted: (none)"
            if controls.get("baseline.submitted", {}).get("label") != submitted:
              raise ValueError("Native Submit state does not match capture request")
            if not isinstance(request.get("requestedAt"), (int, float)) or not 0 < request["requestedAt"] <= time.time():
              raise ValueError("Invalid native request timestamp")
            capture_ids.add(capture_id)
            return capture_id
          def capture_frame(device_id, state, capture_root, capture_ids):
            request_path = capture_root / (state + ".request.json")
            if request_path.is_symlink() or request_path.stat().st_size > 1024 * 1024:
              raise ValueError("Invalid capture request file")
            request_bytes = request_path.read_bytes()
            request = json.loads(request_bytes)
            capture_id = validate_capture_request(request, state, capture_ids)
            image = capture_root / (state + ".png")
            acknowledgment = capture_root / (state + ".ack.json")
            record_path = capture_root / (state + ".capture.json")
            if any(path.exists() for path in (image, acknowledgment, record_path)):
              raise ValueError("Capture output already exists")
            started = time.time()
            invoke(["xcrun", "simctl", "io", device_id, "screenshot", "--type=png", "--display=internal", "--mask=ignored", str(image)], capture_root / (state + ".log"), timeout=30)
            pixels = image.read_bytes()
            if len(pixels) < 33 or pixels[:8] != b"\x89PNG\r\n\x1a\n" or pixels[12:16] != b"IHDR":
              raise ValueError("Native framebuffer did not produce a PNG")
            width, height = struct.unpack(">II", pixels[16:24])
            record = dict(schemaVersion=1, status="captured", captureMethod="simctl-io-screenshot", captureID=capture_id,
              deviceUDID=device_id, state=state, stateQualified=True, synchronizedWithTestState=True,
              requestSHA256=hashlib.sha256(request_bytes).hexdigest(), requestBytes=len(request_bytes),
              imageFile=image.name, bytes=len(pixels), sha256=hashlib.sha256(pixels).hexdigest(), width=width, height=height,
              pixelTransformations=[], maskPolicy="ignored", startedAt=started, capturedAt=time.time())
            save(record_path, record)
            temporary = capture_root / (state + ".ack.pending")
            save(temporary, record)
            os.replace(temporary, acknowledgment)
            return record
          def synchronized_test(command, log, device_id, capture_root):
            capture_root.mkdir()
            deadline = time.monotonic() + 720
            captures, capture_ids = [], set()
            descriptor = os.open(capture_root, os.O_RDONLY)
            try:
              with select.kqueue() as events, log.open("w", encoding="utf-8") as output:
                events.control([select.kevent(descriptor, filter=select.KQ_FILTER_VNODE,
                  flags=select.KQ_EV_ADD | select.KQ_EV_CLEAR, fflags=select.KQ_NOTE_WRITE | select.KQ_NOTE_RENAME)], 0, 0)
                process = subprocess.Popen(command, stdout=output, stderr=subprocess.STDOUT, text=True, start_new_session=True)
                save(capture_root / "process.json", dict(processID=process.pid, command=command, timeoutSeconds=720))
                try:
                  events.control([select.kevent(process.pid, filter=select.KQ_FILTER_PROC,
                    flags=select.KQ_EV_ADD | select.KQ_EV_ONESHOT, fflags=select.KQ_NOTE_EXIT)], 0, 0)
                  for state in states:
                    request = capture_root / (state + ".request.json")
                    while not request.is_file():
                      remaining = deadline - time.monotonic()
                      if remaining <= 0:
                        raise TimeoutError("Native capture phase deadline expired")
                      notifications = events.control(None, 2, remaining)
                      if not notifications:
                        raise TimeoutError("Native state capture request did not arrive")
                      if any(event.filter == select.KQ_FILTER_PROC for event in notifications) and not request.is_file():
                        raise RuntimeError("UI test exited before requesting state " + state)
                    captures.append(capture_frame(device_id, state, capture_root, capture_ids))
                  result = subprocess.CompletedProcess(command, process.wait(timeout=max(1, deadline - time.monotonic())))
                  save(capture_root / "captures.json", captures)
                  return result
                finally:
                  if process.poll() is None:
                    os.killpg(process.pid, signal.SIGTERM)
                    try:
                      process.wait(timeout=10)
                    except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait(timeout=10)
            finally:
              os.close(descriptor)
          for index in (1, 2):
            run = evidence / ("cold-" + str(index))
            run.mkdir(parents=True, exist_ok=True)
            record = dict(index=index, startedAtUTC=datetime.now(timezone.utc).isoformat(), errors=[], testExitCode=None)
            device_id = None
            result_bundle = run / "tests.xcresult"
            try:
              name = "NativeBaseline-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"] + "-cold-" + str(index)
              invoke(["xcrun", "simctl", "create", name, selection["deviceType"]["identifier"], selection["runtime"]["identifier"]], run / "create.log")
              device_id = str(uuid.UUID((run / "create.log").read_text().strip())).upper()
              if device_id in owned:
                raise RuntimeError("Simulator UUID was reused")
              owned.append(device_id)
              save(evidence / "owned-simulators.json", owned)
              record.update(deviceUDID=device_id, deviceName=name, deviceTypeIdentifier=selection["deviceType"]["identifier"], runtimeIdentifier=selection["runtime"]["identifier"], createdFresh=True)
              invoke(["xcrun", "simctl", "bootstatus", device_id, "-b"], run / "boot.log", timeout=240)
              destination = "platform=iOS Simulator,id=" + device_id
              common = ["xcodebuild", "-project", str(root / "source/NativeBaseline.xcodeproj"), "-scheme", "NativeBaseline", "-configuration", "Debug", "-sdk", "iphonesimulator", "-destination", destination, "-destination-timeout", "120", "-derivedDataPath", str(derived), "CODE_SIGN_IDENTITY=", "CODE_SIGNING_REQUIRED=NO", "CODE_SIGNING_ALLOWED=NO", "ARCHS=" + environment["runnerArchitecture"], "ONLY_ACTIVE_ARCH=YES"]
              if not built:
                invoke(common + ["build-for-testing", "-resultBundlePath", str(run / "simulator-build.xcresult")], run / "simulator-build.log", timeout=600)
                invoke(["xcrun", "lipo", "-archs", str(app / "NativeBaseline")], evidence / "logs/simulator-architecture.log")
                if (evidence / "logs/simulator-architecture.log").read_text().strip() != environment["runnerArchitecture"]:
                  raise RuntimeError("Simulator product does not match the native runner architecture")
                plans = list((derived / "Build/Products").glob("*.xctestrun"))
                if len(plans) != 1:
                  raise RuntimeError("Expected exactly one generated native test plan")
                original_test_plan = plans[0]
                built = True
              invoke(["xcrun", "simctl", "install", device_id, str(app)], run / "install.log")
              invoke(["xcrun", "simctl", "get_app_container", device_id, bundle_id, "data"], run / "container.log")
              container = Path((run / "container.log").read_text().strip())
              layout = container / "Documents/native-layout.json"
              if layout.exists():
                raise RuntimeError("Fresh install unexpectedly contains prior application state")
              record["freshInstallHadNoLayoutState"] = True
              capture_root = run / "framebuffer"
              configured_plan = original_test_plan.with_name("NativeBaseline-cold-" + str(index) + ".xctestrun")
              configure_test_plan(original_test_plan, configured_plan, capture_root)
              shutil.copyfile(original_test_plan, run / "original.xctestrun")
              shutil.copyfile(configured_plan, run / "configured.xctestrun")
              command = ["xcodebuild", "test-without-building", "-xctestrun", str(configured_plan), "-destination", destination, "-destination-timeout", "120", "-parallel-testing-enabled", "NO", "-maximum-concurrent-test-simulator-destinations", "1", "-test-timeouts-enabled", "YES", "-default-test-execution-time-allowance", "120", "-maximum-test-execution-time-allowance", "180", "-only-testing:NativeBaselineUITests/NativeBaselineUITests/testColdLaunchActionsAndLayout", "-resultBundlePath", str(result_bundle)]
              result = synchronized_test(command, run / "test.log", device_id, capture_root)
              record["testExitCode"] = result.returncode
              result.check_returncode()
              invoke(["xcrun", "simctl", "get_app_container", device_id, bundle_id, "data"], run / "container-after-test.log")
              container = Path((run / "container-after-test.log").read_text().strip())
              shutil.copyfile(container / "Documents/native-layout.json", run / "native-layout.json")
              framebuffer = run / "framebuffer-probe.png"
              invoke(["xcrun", "simctl", "io", device_id, "screenshot", "--type=png", "--display=internal", "--mask=ignored", str(framebuffer)], run / "framebuffer-probe.log")
              pixels = framebuffer.read_bytes()
              if pixels[:8] != b"\x89PNG\r\n\x1a\n" or pixels[12:16] != b"IHDR":
                raise RuntimeError("Framebuffer probe did not produce a PNG")
              width, height = struct.unpack(">II", pixels[16:24])
              native_bounds = json.loads((run / "native-layout.json").read_text())["nativeScreenBounds"]
              save(run / "framebuffer-probe.json", dict(captureMethod="simctl-io-screenshot", deviceUDID=device_id,
                synchronizedWithTestState=False, stateQualified=False, pixelTransformations=[], maskPolicy="ignored",
                bytes=len(pixels), sha256=hashlib.sha256(pixels).hexdigest(), width=width, height=height,
                nativeScreenBounds=native_bounds, fullNativeDimensions=width == native_bounds["width"] and height == native_bounds["height"]))
            except Exception as error:
              failure_code = failure_code or (getattr(error, "returncode", None) or 1)
              record["errors"].append(str(error))
            finally:
              if result_bundle.is_dir():
                try:
                  invoke(["xcrun", "xcresulttool", "export", "attachments", "--help"], run / "export-help.log")
                  help_text = (run / "export-help.log").read_text()
                  if "--path" not in help_text or "--output-path" not in help_text:
                    raise RuntimeError("Unsupported xcresulttool attachment export interface")
                  invoke(["xcrun", "xcresulttool", "export", "attachments", "--path", str(result_bundle), "--output-path", str(run / "attachments")], run / "export.log", timeout=120)
                  invoke(["xcrun", "xcresulttool", "get", "test-results", "summary", "--path", str(result_bundle)], run / "test-summary.json", timeout=120)
                  record["attachmentExport"] = "exported"
                except Exception as error:
                  record["attachmentExport"] = "raw-xcresult-retained"
                  record["errors"].append(str(error))
                  failure_code = failure_code or 1
              if device_id is not None and device_id in owned:
                for action in ("shutdown", "delete"):
                  try:
                    result = invoke(["xcrun", "simctl", action, device_id], run / ("cleanup-" + action + ".log"), timeout=90, check=False)
                    record["cleanup" + action.title() + "ExitCode"] = result.returncode
                    if action == "delete" and result.returncode:
                      raise RuntimeError("Failed to delete owned simulator " + device_id)
                  except Exception as error:
                    record["errors"].append(str(error))
                    failure_code = failure_code or 1
              record["finishedAtUTC"] = datetime.now(timezone.utc).isoformat()
              save(run / "run.json", record)
          sys.exit(failure_code if 0 <= failure_code <= 255 else 1)
          PY

      - name: Verify retained evidence and write the artifact manifest
        id: manifest
        if: always()
        env:
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          SOURCE_PIN_OUTCOME: ${{ steps.source-pin.outcome }}
          ENVIRONMENT_OUTCOME: ${{ steps.environment.outcome }}
          ARCHIVE_OUTCOME: ${{ steps.archive.outcome }}
          COLD_OUTCOME: ${{ steps.cold.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import struct
          import subprocess
          import sys
          import zlib

          root = Path(os.environ["BASELINE_ROOT"])
          evidence = root / "evidence"
          evidence.mkdir(parents=True, exist_ok=True)
          errors = []
          def require(condition, message):
            if not condition:
              errors.append(message)
          def load(path):
            try:
              return json.loads(path.read_text(encoding="utf-8"))
            except Exception as error:
              errors.append(str(path.relative_to(root)) + ": " + str(error))
              return {}
          def digest(path):
            return hashlib.sha256(path.read_bytes()).hexdigest()
          for stage in ("GENERATE", "SOURCE_PIN", "ENVIRONMENT", "ARCHIVE", "COLD"):
            require(os.environ.get(stage + "_OUTCOME") == "success", stage + " stage did not succeed")
          source_manifest = load(root / "source-manifest.json")
          for item in source_manifest.get("files", []):
            path = root / "source" / item["path"]
            require(path.is_file() and digest(path) == item["sha256"], "Source changed after manifest: " + item["path"])
          environment = load(evidence / "environment.json")
          identifiers = {"baseline.title", "baseline.count", "baseline.increment", "baseline.reset", "baseline.input", "baseline.submit", "baseline.submitted"}
          expected_states = {"initial": "Count: 0", "increment-1": "Count: 1", "increment-2": "Count: 2", "reset": "Count: 0", "submitted": "Count: 0"}
          runs = []
          total_pngs = 0
          def contains(outer, inner):
            return inner["width"] > 0 and inner["height"] > 0 and inner["x"] >= outer["x"] and inner["y"] >= outer["y"] and inner["x"] + inner["width"] <= outer["x"] + outer["width"] and inner["y"] + inner["height"] <= outer["y"] + outer["height"]
          def png_metadata(path, data):
            if len(data) < 33 or data[:8] != b"\x89PNG\r\n\x1a\n" or data[12:16] != b"IHDR" or struct.unpack(">I", data[8:12])[0] != 13:
              raise ValueError("Invalid PNG signature or IHDR: " + str(path))
            width, height, bit_depth, color_type, compression, filtering, interlace = struct.unpack(">IIBBBBB", data[16:29])
            if width <= 0 or height <= 0:
              raise ValueError("Empty PNG dimensions")
            offset, image_bytes, chunks = 8, 0, []
            while offset + 12 <= len(data):
              length = struct.unpack(">I", data[offset:offset + 4])[0]
              kind = data[offset + 4:offset + 8]
              end = offset + 8 + length
              if end + 4 > len(data) or zlib.crc32(data[offset + 4:end]) & 0xFFFFFFFF != struct.unpack(">I", data[end:end + 4])[0]:
                raise ValueError("PNG chunk length/CRC failure")
              chunks.append(kind.decode("ascii"))
              if kind == b"IDAT":
                image_bytes += length
              offset = end + 4
              if kind == b"IEND":
                break
            if not chunks or chunks[-1] != "IEND" or image_bytes == 0 or offset != len(data):
              raise ValueError("Incomplete PNG image data")
            result = subprocess.run(["sips", "-g", "pixelWidth", "-g", "pixelHeight", "-g", "format", "-g", "space", "-g", "samplesPerPixel", "-g", "bitsPerSample", "-g", "hasAlpha", str(path)], capture_output=True, text=True, timeout=30, check=True)
            if re.search(r"pixelWidth:\s*" + str(width) + r"\b", result.stdout) is None or re.search(r"pixelHeight:\s*" + str(height) + r"\b", result.stdout) is None:
              raise ValueError("sips and PNG IHDR dimensions differ")
            return dict(path=str(path.relative_to(evidence)), bytes=len(data), sha256=hashlib.sha256(data).hexdigest(), width=width, height=height, bitDepth=bit_depth, colorType=color_type, compression=compression, filtering=filtering, interlace=interlace, chunks=chunks, sips=result.stdout, pixelContentCompared=False)
          for index in (1, 2):
            run = evidence / ("cold-" + str(index))
            record = load(run / "run.json")
            summary = load(run / "test-summary.json")
            native = load(run / "native-layout.json")
            require(record.get("createdFresh") is True and record.get("freshInstallHadNoLayoutState") is True, "Cold run " + str(index) + " is not proven fresh")
            require(record.get("testExitCode") == 0 and not record.get("errors"), "Cold run " + str(index) + " failed")
            require(summary.get("totalTestCount") == 1 and summary.get("passedTests") == 1 and summary.get("failedTests") == 0 and summary.get("skippedTests") == 0, "Cold run " + str(index) + " did not execute exactly one passing UI test")
            require(record.get("cleanupDeleteExitCode") == 0, "Owned simulator deletion was not successful")
            require(native.get("count") == 0 and native.get("submittedLabel") == "Submitted: Hello native iOS" and native.get("interfaceStyle") == "light", "Final native app state differs")
            require(native.get("scale", 0) > 0 and native.get("safeAreaInsets", {}).get("top", 0) > 0 and bool(native.get("operatingSystemVersion")), "Native screen/OS/safe-area metadata is incomplete")
            require({control["identifier"] for control in native.get("controls", [])} == identifiers, "Native control inventory differs")
            for control in native.get("controls", []):
              require(contains(native["safeAreaBounds"], control["frame"]) and control["enabled"] and not control["hidden"] and control["alpha"] > 0, "Native control is outside safe area or unavailable: " + control["identifier"])
            observations, pngs = {}, []
            for path in sorted((run / "attachments").rglob("*")):
              if not path.is_file():
                continue
              data = path.read_bytes()
              try:
                if data.startswith(b"\x89PNG\r\n\x1a\n"):
                  pngs.append(png_metadata(path, data))
                elif data.lstrip().startswith(b"{"):
                  value = json.loads(data)
                  if value.get("kind") == "native-ui-observation":
                    require(value["state"] not in observations, "Duplicate native state observation")
                    observations[value["state"]] = value
              except Exception as error:
                errors.append(str(path.relative_to(evidence)) + ": " + str(error))
            require(set(observations) == set(expected_states), "Cold run " + str(index) + " is missing state observations")
            for state, observation in observations.items():
              controls = {control["identifier"]: control for control in observation["controls"]}
              require(set(controls) == identifiers, "Accessibility control inventory differs: " + state)
              require(controls.get("baseline.count", {}).get("label") == expected_states.get(state), "Count differs: " + state)
              require(controls.get("baseline.submitted", {}).get("label") == ("Submitted: Hello native iOS" if state == "submitted" else "Submitted: (none)"), "Submitted state differs: " + state)
              require(all(identifier in observation.get("accessibilityDebugDescription", "") for identifier in identifiers), "Accessibility debug description is incomplete: " + state)
              for control in controls.values():
                require(control["enabled"] and control["hittable"] and contains(observation["windowBounds"], control["frame"]), "UI test control is occluded or out of bounds: " + state)
            diagnostic_pngs, pngs, capture_ids = pngs, [], set()
            for state in expected_states:
              try:
                capture_root = run / "framebuffer"
                request_path = capture_root / (state + ".request.json")
                request = load(request_path)
                capture = load(capture_root / (state + ".capture.json"))
                acknowledgment = load(capture_root / (state + ".ack.json"))
                observation = observations.get(state, {})
                require(capture == acknowledgment == observation.get("framebufferCapture"), "Native capture acknowledgment differs: " + state)
                require(request.get("observation") == {key: value for key, value in observation.items() if key != "framebufferCapture"}, "Capture request and native observation differ: " + state)
                require(request.get("state") == capture.get("state") == state and request.get("captureID") == capture.get("captureID"), "Capture state or identity differs: " + state)
                require(capture.get("captureID") not in capture_ids, "Capture identity reused")
                capture_ids.add(capture.get("captureID"))
                require(capture.get("deviceUDID") == record.get("deviceUDID") and capture.get("status") == "captured" and capture.get("captureMethod") == "simctl-io-screenshot", "Capture device or method differs: " + state)
                require(capture.get("stateQualified") is True and capture.get("synchronizedWithTestState") is True and capture.get("pixelTransformations") == [] and capture.get("maskPolicy") == "ignored", "Capture is not synchronized and unmodified: " + state)
                require(capture.get("requestSHA256") == digest(request_path) and capture.get("requestBytes") == request_path.stat().st_size, "Capture request bytes differ: " + state)
                require(0 < request["requestedAt"] <= capture["startedAt"] <= capture["capturedAt"], "Capture time ordering differs: " + state)
                image_path = capture_root / (state + ".png")
                image = png_metadata(image_path, image_path.read_bytes())
                require(capture.get("imageFile") == image_path.name and image["sha256"] == capture.get("sha256") and image["bytes"] == capture.get("bytes"), "Captured PNG identity differs: " + state)
                require(image["width"] == capture.get("width") and image["height"] == capture.get("height"), "Capture dimensions differ: " + state)
                pngs.append(dict(image, state=state, captureID=capture.get("captureID"), captureMethod="simctl-io-screenshot"))
              except Exception as error:
                errors.append("Synchronized native state " + state + ": " + str(error))
            require(len(pngs) == len(expected_states), "Cold run " + str(index) + " needs all five synchronized PNG screenshots")
            for image in pngs:
              require(image["width"] == native.get("nativeScreenBounds", {}).get("width") and image["height"] == native.get("nativeScreenBounds", {}).get("height"), "Screenshot is not the complete native screen")
            total_pngs += len(pngs)
            if run.is_dir():
              (run / "xctest-png-metadata.json").write_text(json.dumps(diagnostic_pngs, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              (run / "png-metadata.json").write_text(json.dumps(pngs, indent=2, sort_keys=True) + "\n", encoding="utf-8")
            runs.append(dict(record=record, testSummary=summary, nativeLayout=native, states=sorted(observations), verifiedPNGCount=len(pngs)))
          device_ids = [run["record"].get("deviceUDID") for run in runs]
          require(None not in device_ids and len(set(device_ids)) == 2, "Two distinct owned simulator UUIDs are required")
          inventory = [dict(path=str(path.relative_to(evidence)), bytes=path.stat().st_size, sha256=digest(path)) for path in sorted(evidence.rglob("*")) if path.is_file() and path.name != "artifact-manifest.json"]
          manifest = dict(schemaVersion=1, baselineScope="primitive UIKit", captureMethod="state-synchronized-simctl", originalAppQualified=False, localRenderingMatched=False, pixelContentCompared=False, appSourceSHA256=source_manifest.get("appSourceSHA256"), sourceManifestSHA256=digest(root / "source-manifest.json") if (root / "source-manifest.json").is_file() else None, workflowSHA256=source_manifest.get("workflowSHA256"), commit=os.environ["GITHUB_SHA"], ref=os.environ["GITHUB_REF"], runID=os.environ["GITHUB_RUN_ID"], runAttempt=os.environ["GITHUB_RUN_ATTEMPT"], environment=environment, unsignedPhysicalArchiveCompiled=os.environ.get("ARCHIVE_OUTCOME") == "success", coldRuns=runs, verifiedPNGCount=total_pngs, validation=dict(status="failed" if errors else "passed", errors=errors), evidenceFiles=inventory)
          (evidence / "artifact-manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(dict(status=manifest["validation"]["status"], verifiedPNGCount=total_pngs, errors=errors), indent=2))
          sys.exit(1 if errors else 0)
          PY

      - name: Retain exact embedded native sources
        id: upload-source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ios-baseline-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.BASELINE_ROOT }}/source/NativeBaseline/App.swift
            ${{ env.BASELINE_ROOT }}/source/NativeBaseline/Info.plist
            ${{ env.BASELINE_ROOT }}/source/NativeBaselineUITests/UITest.swift
            ${{ env.BASELINE_ROOT }}/source/NativeBaselineUITests/Info.plist
            ${{ env.BASELINE_ROOT }}/source/NativeBaseline.xcodeproj/project.pbxproj
            ${{ env.BASELINE_ROOT }}/source/NativeBaseline.xcodeproj/xcshareddata/xcschemes/NativeBaseline.xcscheme
            ${{ env.BASELINE_ROOT }}/source-manifest.json
          if-no-files-found: error
          retention-days: 7

      - name: Retain logs, raw xcresults, PNGs and native metadata
        id: upload-evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-ios-baseline-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.BASELINE_ROOT }}/evidence
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

      - name: Summarize the native baseline and link artifacts
        if: always()
        env:
          SOURCE_ARTIFACT_URL: ${{ steps.upload-source.outputs.artifact-url }}
          EVIDENCE_ARTIFACT_URL: ${{ steps.upload-evidence.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["BASELINE_ROOT"]) / "evidence/artifact-manifest.json"
          manifest = json.loads(path.read_text()) if path.is_file() else {}
          selection = manifest.get("environment", {}).get("selection", {})
          lines = ["## Primitive UIKit Native Baseline", "", "Not the original ADCIOSVisualizer. No browser rendering or rendering-parity claim.", "", "- baselineScope: primitive UIKit", "- originalAppQualified: false", "- localRenderingMatched: false", "- Evidence gate: " + manifest.get("validation", {}).get("status", "not produced"), "- App.swift SHA-256: `" + str(manifest.get("appSourceSHA256", "unavailable")) + "`", "- Deployment target: iOS 15.0 (not a claim of an iOS 15 simulator)", "- Actual runtime: " + selection.get("runtime", {}).get("identifier", "unavailable"), "- Runtime build: " + selection.get("runtime", {}).get("buildversion", "unavailable"), "- iPhone model: " + selection.get("deviceType", {}).get("name", "unavailable"), "- Verified PNG files: " + str(manifest.get("verifiedPNGCount", 0)), ""]
          for label, variable in [("Exact native sources", "SOURCE_ARTIFACT_URL"), ("Native evidence, PNGs, logs and xcresults", "EVIDENCE_ARTIFACT_URL")]:
            url = os.environ.get(variable, "")
            lines.append("[" + label + "](" + url + ")" if url else label + ": upload unavailable")
          lines.extend(["", "Further comparison requires the exact source hash and recorded native environment. PNGs are retained unchanged; no masks or tolerance-based parity decision is made.", ""])
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
            summary.write("\n".join(lines))
          PY
